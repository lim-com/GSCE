<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Emscripten-Generated Code</title>
</head>
<style>
    #canvas-container {
        position: relative;          /* Теперь это точка отсчёта для absolute-элементов */
        display: inline-block;       /* чтобы контейнер облегал canvas */
        line-height: 0;
        border-radius: 0;
        overflow: hidden;            /* скроет возможные выступающие края */
    }

    #overlay-title {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        background: rgba(0, 0, 0, 0.5);
        padding: 4px 12px;
        border-radius: 6px;
        font-weight: 400;
        font-size: 1.3rem;
        margin: 0;
        pointer-events: none;        /* не мешает кликам по canvas */
        z-index: 10;
    }

    input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 140px;               /* подберите нужную ширину */
        height: 6px;
        background: #4a4a4a;        /* дорожка */
        border-radius: 3px;
        outline: none;
        cursor: pointer;
        margin: 0 8px;
    }

    input[type="range"]::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #f0f0f0;
        border: 2px solid #888;
        cursor: pointer;
    }

    .controls {
        position: absolute;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0);
        backdrop-filter: blur(6px);   /* лёгкое размытие подложки */
        padding: 10px 20px;
        border-radius: 14px;
        border-color: bisque;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        z-index: 10;
        pointer-events: auto;         /* кнопки должны быть кликабельны */

    }

    /* Остальные стили для input/button оставьте как есть */
    canvas {
        display: block;
        background: #000;
        position: relative;
        z-index: 1;                   /* самый нижний слой */
    }
</style>
<body>
<div id="canvas-container">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div class="controls">
        <label for="widthInput">Ширина: <span id="widthValue">800</span></label>
        <input type="range" id="widthInput" min="" max="3840" value="800" step="1">

        <label for="heightInput">Высота: <span id="heightValue">600</span></label>
        <input type="range" id="heightInput" min="720" max="1080" value="600" step="1">
        <button id="fullscreenBtn" onclick="Module.canvas.requestFullscreen()">FULLSCREEN</button>
        <button id="resizeBtn">🔄 apply</button>
    </div>
</div>

<script>
    // Создаём объект Module, который Emscripten дополнит своими методами.
    // canvas должен быть найден в DOM на момент выполнения этого скрипта.
    var Module = {
        canvas: document.getElementById('canvas')
    };
    // Проверка на случай отсутствия элемента (страховка)
    if (!Module.canvas) {
        console.error('Canvas #canvas не найден! Убедитесь, что элемент существует.');
    }
</script>

<!-- Подключите скомпилированный JS-файл (сгенерированный Emscripten) -->

<script>
    (function() {
        // Функция изменения размера холста и вызова Wasm-метода
        function resizeCanvas(width, height) {
            const canvas = document.getElementById('canvas');
            if (!canvas) {
                console.error('Canvas #canvas не найден');
                return;
            }

            // Проверяем, что модуль Wasm инициализирован и SetWindowSize доступна
            if (typeof Module !== 'undefined' && Module._ResizeCanvas) {
                // Вызываем raylib-функцию для настоящего изменения размера окна/контекста
                Module._ResizeCanvas(width, height);

                // Синхронизируем атрибуты canvas (не обязательно, но полезно для CSS/позиционирования)
                canvas.width = width;
                canvas.height = height;

                console.log(`✅ Размер изменён на ${width}x${height}`);
            } else {
                alert('Модуль Wasm ещё не готов или функция SetWindowSize не экспортирована.\n' +
                    'Добавьте в C-код EMSCRIPTEN_KEEPALIVE для SetWindowSize или укажите экспорт при компиляции.');
            }
        }

        // Обработчик кнопки "Применить"
        document.getElementById('resizeBtn').addEventListener('click', function() {
            const w = parseInt(document.getElementById('widthInput').value, 10);
            const h = parseInt(document.getElementById('heightInput').value, 10);
            if (!isNaN(w) && !isNaN(h) && w > 0 && h > 0) {
                resizeCanvas(w, h);
            } else {
                alert('Введите корректные положительные числа.');
            }
        });

        // Автоматически обновить поля ввода после инициализации Wasm (если размер стал другим)
        // Можно отложенно проверить текущий размер canvas
        function syncInputsFromCanvas() {
            const canvas = document.getElementById('canvas');
            if (canvas && canvas.width && canvas.height) {
                document.getElementById('widthInput').value = canvas.width;
                document.getElementById('heightInput').value = canvas.height;
            }
        }

        // Пытаемся несколько раз синхронизировать, т.к. Wasm инициализация может занять время
        let attempts = 0;
        const maxAttempts = 20;
        const interval = setInterval(function() {
            if (typeof Module !== 'undefined' && Module._ResizeCanvas) {
                syncInputsFromCanvas();
                clearInterval(interval);
                console.log('📐 Размер холста синхронизирован с WASM.');
            } else if (++attempts >= maxAttempts) {
                clearInterval(interval);
                console.warn('Не удалось дождаться инициализации Wasm модуля.');
            }
        }, 500);
    })();
</script>
